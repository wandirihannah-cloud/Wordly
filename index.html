<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Wordly Dictionery</h1>
        <p>Get a defination for any word you can think of</p>
    </header>

    <main>
        <h2>Get to know the meaning of any word</h2>
        <p>You are able to search a word and know its meaning and how to pronounce it</p>

        <form>
            <label for ="word">Enter a word</label>
            <input
            type="text"
            id="word"
            placeholder="Type your word here...">
            <button type="submit"></button>
        </form>
<section id="results" aria-live="polite">
    <p id="message">Search for a word to see its meaning.</p>

    <div id="word-details">
        <h2 id="searched-word"></h2>

        <p id="pronunciation"></p>

        <h3>Definitions</h3>
        <ul id="definitions"></ul>

        <h3>Synonyms</h3>
        <ul id="synonyms"></ul>
    </div>
</section>


    </main>
    
</body>
<script src="index.js"></script>
</html>
